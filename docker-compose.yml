services:
    qdrant:
      image: qdrant/qdrant
      ports: 
        - 6333:6333 
        
    postgresdb:
    image: postgres:15
    restart: unless-stopped
    container_name: build_forms_DB

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dev

    ports:
      - "5439:5432"

    volumes:
      - pg_data:/var/lib/postgresql/data       